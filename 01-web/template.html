.layout-open{width:100%;margin-top:13px}.layout-scope{margin-top:12px;color:#d9ca9e;font-size:calc(10px * var(--text-scale,1));font-weight:700}.layout-map{position:relative;height:205px;margin:8px 0;border:1px solid rgba(195,210,179,.34);border-radius:10px;overflow:hidden;touch-action:none;user-select:none;background-color:#16424a;background-image:linear-gradient(rgba(207,233,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(207,233,214,.06) 1px,transparent 1px),radial-gradient(ellipse at 50% 20%,rgba(128,205,185,.15),transparent 60%);background-size:25% 25%,25% 25%,100% 100%}.layout-back-label,.layout-front-label{position:absolute;left:9px;color:rgba(216,230,209,.55);font-size:9px;pointer-events:none}.layout-back-label{top:5px}.layout-front-label{bottom:5px}.layout-empty{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#b6c8b5;font-size:11px;text-align:center}.layout-item{position:absolute;z-index:1;transform:translate(-50%,-50%);width:42px;height:42px;padding:0;border:1px solid rgba(225,225,191,.55);border-radius:50%;display:grid;place-items:center;color:#d8f3cf;box-shadow:0 3px 8px rgba(0,0,0,.25);background:#2f6c5c;touch-action:none}.layout-item.selected{z-index:5;outline:2px solid #f2d294;outline-offset:2px}.layout-item.layout-rock{background:#536d69;color:#e5e3d2}.layout-item.layout-sand{background:#aa9270;color:#f7ead0}.layout-symbol{font-size:22px;line-height:1;pointer-events:none}.layout-item small{position:absolute;right:2px;bottom:0;font:700 9px Georgia,serif;color:#fff;pointer-events:none}.layout-item-list{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0 5px}.layout-item-list::-webkit-scrollbar{display:none}.layout-chip,.layout-presets button{flex:none;min-height:32px;padding:0 9px;border:1px solid rgba(208,209,173,.25);border-radius:6px;background:rgba(10,42,46,.75);color:#c9d8c6;font-size:calc(9px * var(--text-scale,1))}.layout-chip.selected{border-color:#e0c686;background:rgba(160,141,89,.23);c .showcase-banner{margin:0 0 14px;padding:10px 12px;border:1px solid rgba(211,190,127,.3);border-radius:9px;background:rgba(105,94,54,.17);color:#e1d0a3;font-size:calc(10px * var(--text-scale,1));line-height:1.65}.showcase-tag{color:#e0c98f!important}.fish-chip.showcase-fish{border-color:rgba(217,197,142,.26)}.showcase-dex-tag{position:absolute;right:3px;bottom:3px;color:#d8c28e;background:#163b42;border-radius:3px;padding:1px 3px;font-size:calc(7px * var(--text-scale,1));line-height:1.2}.demo-facts{margin:14px 0;text-align:left}.showcase-cell img{opacity:.84}.title-backup{color:#91aaa3;font-size:calc(9px * var(--text-scale,1));line-height:1.5;margin-top:8px}.title-backup .small-link{display:block;margin:4px auto;color:#eed493}.backup-conflict-banner{border:1px solid rgba(225,194,128,.45);background:rgba(120,90,42,.25);padding:11px;border-radius:9px;margin-bottom:12px;color:#e8d5ab;font-size:calc(10px * var(--text-scale,1));line-height:1.55}.backup-conflict-banner strong,.backup-conflict-banner span{display:block}.backup-controls{padding:10px 12px;color:#a9bbb1;font-size:calc(9px * var(--text-scale,1));line-height:1.6}.backup-controls p{margin:0 0 4px}.backup-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:16px 0}.backup-compare>div{background:rgba(26,64,66,.6);border:1px solid rgba(195,190,150,.25);border-radius:8px;padding:10px;min-width:0}.backup-compare strong,.backup-compare span,.backup-compare small{display:block;line-height:1.55}.backup-compare span,.backup-compare small{font-size:calc(9px * var(--text-scale,1));color:#a8bdb1;margin-top:4px}.backup-compare .small-link{font-size:calc(10px * var(--text-scale,1));padding:9px 0 3px}[data-backup-conflict][hidden],[data-backup-retry][hidden]{display:none!important}

.room-scene[data-habitat="reef"][data-water="marine"][data-light="warm"]{background-image:linear-gradient(180deg,rgba(100,65,25,.30),rgba(12,27,25,.35)),var(--habitat)}
.room-scene[data-habitat="reef"][data-water="marine"][data-light="blue"]{background-image:linear-gradient(180deg,rgba(15,52,107,.34),rgba(8,24,46,.40)),var(--habitat)}
.dex-size-label[data-size-class="giant"],.detail-size-label[data-size-class="giant"]{color:#ffe0bc}.detail-size-label[data-size-class="giant"]{border-color:rgba(245,192,147,.55);background:rgba(150,99,72,.22)}
.facts-sources{display:flex;flex-wrap:wrap;gap:12px}.facts-sources a{color:#e0c999;text-decoration:underline;text-underline-offset:3px}.species-facts{text-align:left}.species-facts i{font-family:Georgia,serif;overflow-wrap:anywhere}

@media(max-width:450px){.dex-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.dex-cell{min-height:105px}.dex-cell .name{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:19px}}

.detail-size-label[data-size-class="colossal"]{border-color:rgba(249,188,131,.65);background:rgba(163,91,64,.27)}
